<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register - Earthelic</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</head>
<body>
    <header class="head1">
        <a href="landing.html"><img src="imgs/earthelic logo file png.png" alt="Earthelic Logo" id="logo1"></a>
        <nav class="nav1">
            <div class="icons1">
                <ul class="nav-links">
                    <li><a href="landing.html">Home</a></li>
                    <li><a href="metal.html">Metal</a></li>
                    <li><a href="ceramic.html">Ceramic</a></li>
                    <li><a href="cart.html">Cart</a></li>
                    <li><a href="about.html">About us</a></li>
                    <li><a href="login.html" class="active">Log In</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="logo-container">
            <img src="imgs/earthelic logo file png.png" alt="Earthelic Logo" class="logo" id="logo">
        </div>
        
        <div class="form-container">
            <!-- Login Form -->
            <div class="form-wrapper active" id="login-form">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <div class="icon-wrapper">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <input type="email" id="loginEmail" placeholder="Email" required>
                        <span class="error-message" id="loginEmailError"></span>
                    </div>
                    <div class="input-group">
                        <div class="icon-wrapper">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div class="password-field">
                            <input type="password" id="loginPassword" placeholder="Password" required>
                            <button type="button" class="toggle-password" id="toggleLoginPassword">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="loginPasswordError"></span>
                    </div>
                    <div class="forgot-password">
    <a href="forgot-password.html">Forgot Password?</a>
</div>
                    <button type="submit" class="btn">Login</button>
                </form>
                <p class="toggle-text">Don't have an account? <a href="#" id="show-register">Register</a></p>
            </div>
            
            <!-- Registration Form -->
            <div class="form-wrapper" id="register-form">
                <h2>Register</h2>
                <form id="registerForm">
                    <div class="input-group">
                        <div class="icon-wrapper">
                            <i class="fas fa-user"></i>
                        </div>
                        <input type="text" id="fullName" placeholder="Full Name" required>
                        <span class="error-message" id="fullNameError"></span>
                    </div>
                    <div class="input-group">
                        <div class="icon-wrapper">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <input type="email" id="email" placeholder="Email" required>
                        <span class="error-message" id="emailError"></span>
                    </div>
                    <div class="input-group">
                        <div class="icon-wrapper">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div class="password-field">
                            <input type="password" id="password" placeholder="Password" required>
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>
                    <div class="input-group">
                        <div class="icon-wrapper">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div class="password-field">
                            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                            <button type="button" class="toggle-password" id="toggleConfirmPassword">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="confirmPasswordError"></span>
                    </div>
                    <button type="submit" class="btn">Register</button>
                </form>
                <p class="toggle-text">Already have an account? <a href="#" id="show-login">Login</a></p>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
