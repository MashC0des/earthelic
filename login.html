<section class="main_sec">
    <div class="home-content-log">
        <div class="wrapper">
            <form action="#">
              <h2>Login</h2>
                <div class="input-field">
                <input type="text" required>
                <label>Enter your email</label>
              </div>
              <div class="input-field">
                <input type="password" required>
                <label>Enter your password</label>
              </div>
              <div class="forget">
                <label for="remember">
                  <input type="checkbox" id="remember">
                  <p>Remember me</p>
                </label>
                <a href="#">Forgot password?</a>
              </div>
              <button type="submit">Log In</button>
              <div class="register">
                <p>Don't have an account? <a href="#" onclick="showreg()">Register</a></p>
              </div>
            </form>
          </div>
        <!--------------------------------------------------------------------------------------------->
        <div class="wrapper1">
            <form action="#">
              <h2>SignUp</h2>
                <div class="input-field">
                    <input type="text" required>
                    <label>Enter your Name</label>
              </div>
              <div class="input-field">
                <input type="number" required>
                <label>Enter your Mobile number</label>
            </div>
            <div class="input-field">
                <input type="text" required>
                <label>Enter your Email</label>
          </div>
              <div class="input-field">
                <input type="password" required>
                <label>Enter your Password</label>
              </div>
              <button type="submit" id="su">Sign up</button>
             
              <div class="register">
                <p>Already have an account? <a href="#" onclick="showlog()" style="color: black;" >Login</a></p>
              </div>
            </form>
          </div>
          <img src="imgs/earthelic logo file png.png" style="height: 350px;" alt="">
    </div>
